server:
  port: 8080

spring:
  application:
    name: exam-management-backend
  datasource:
    url: jdbc:h2:file:./data/examdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: super-secret-exam-management-key-replace-in-production-environments-32bytes
    expirationMs: 86400000

logging:
  level:
    com.exam: INFO
    org.springframework.web: INFO
